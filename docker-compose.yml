# docker compose up -d   ->  http://localhost:8080
# Values come from .env (git-ignored). Start from:  cp .env.example .env

name: loantrack

services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Run once, in file-name order, only when the pgdata volume is empty.
      - ./db/migrations/001_create_loans.sql:/docker-entrypoint-initdb.d/001_create_loans.sql:ro
      - ./db/seed/002_seed_loans.sql:/docker-entrypoint-initdb.d/002_seed_loans.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [loantrack]
    restart: unless-stopped
    # No "ports:" on purpose - the database is only reachable on the compose network.

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-v1}
    image: loantrack-backend:${APP_VERSION:-v1}
    environment:
      DB_HOST: db                 # service name, resolved by Docker's embedded DNS
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POOL_MIN_SIZE: "1"
      DB_POOL_MAX_SIZE: "5"
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    networks: [loantrack]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: ${APP_VERSION:-v1}
    image: loantrack-frontend:${APP_VERSION:-v1}
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [loantrack]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  loantrack:
    name: loantrack-net

volumes:
  pgdata:
    name: loantrack-pgdata
