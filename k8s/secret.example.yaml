# EXAMPLE ONLY - dummy values. Do not put real credentials in git.
#
# Create the real Secret one of these ways:
#   1) ./scripts/deploy.sh creates it from your git-ignored .env, or
#   2) by hand:
#      kubectl -n loantrack create secret generic loantrack-db \
#        --from-literal=POSTGRES_USER=loantrack \
#        --from-literal=POSTGRES_PASSWORD='<a strong password>'
#
# Note: Secret data is only base64-encoded, not encrypted. Anyone who can read Secrets in the
# namespace can decode it. In production use etcd encryption at rest plus an external store
# (e.g. GCP Secret Manager via External Secrets Operator) or Sealed Secrets for GitOps.
apiVersion: v1
kind: Secret
metadata:
  name: loantrack-db
  namespace: loantrack
  labels:
    app.kubernetes.io/part-of: loantrack
type: Opaque
stringData:
  POSTGRES_USER: loantrack
  POSTGRES_PASSWORD: change-me-example-only
