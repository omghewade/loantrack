apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: loantrack
  labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: loantrack }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: frontend }
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080      # open with: minikube service frontend -n loantrack
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: loantrack
  labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: loantrack }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: frontend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: loantrack }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: loantrack-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_URL
              valueFrom: { configMapKeyRef: { name: loantrack-config, key: BACKEND_URL } }
          # nginx is up in well under a second; /healthz is served by nginx itself.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            # nginx renders its config template here at start, and needs /tmp for cache/pid.
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
