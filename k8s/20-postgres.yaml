# PostgreSQL as a StatefulSet with a volumeClaimTemplate: stable pod name (postgres-0) and a
# PVC that is re-attached to the same pod identity after a restart or reschedule.
#
# The db-init ConfigMap (schema + seed SQL) is created by scripts/deploy.sh from db/ so the SQL
# has one source of truth shared with Docker Compose.
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: loantrack
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: loantrack }
spec:
  clusterIP: None            # governing Service for the StatefulSet (stable DNS per pod)
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - name: postgres
      port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: loantrack
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: loantrack }
spec:
  type: ClusterIP            # reachable only from inside the cluster
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: loantrack
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: loantrack }
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: loantrack }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70        # "postgres" user in the alpine image
        runAsGroup: 70
        fsGroup: 70          # makes the mounted volume writable by uid 70
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:16.6-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: loantrack-config, key: DB_NAME } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: loantrack-db, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: loantrack-db, key: POSTGRES_PASSWORD } }
            # Sub-directory, because the volume root may contain lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: db-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            # First start runs initdb + seed; give it time before liveness can kill it.
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: db-init
          configMap:
            name: db-init
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: loantrack }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
