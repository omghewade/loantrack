name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  images:
    runs-on: ubuntu-24.04
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t loantrack-backend:ci backend
      - name: Backend image must stay under 300 MB
        run: |
          size=$(docker image inspect loantrack-backend:ci --format '{{.Size}}')
          echo "backend image: $((size / 1024 / 1024)) MB"
          test "$size" -lt $((300 * 1024 * 1024))
      - name: Build frontend image
        run: docker build -t loantrack-frontend:ci frontend
